# Regenerates the GitHub stats / top-languages cards embedded in README.md and commits them
# to profile/. Cards are served from this repo, so they keep working even when the public
# github-readme-stats instance is down or rate-limited.
name: Update profile cards

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

env:
  STATS: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&hide=stars&line_height=24"
  # Jupyter/HTML/TeX are excluded because notebook and markup bytes would otherwise dominate the card.
  LANGS: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=jupyter%20notebook,html,tex&size_weight=0.5&count_weight=0.5"
  # GitHub Primer colours, so the cards blend into GitHub's own dark and light themes.
  DARK: "bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&icon_color=8b949e&border_color=30363d&border_radius=6"
  LIGHT: "bg_color=ffffff&title_color=0969da&text_color=1f2328&icon_color=656d76&border_color=d0d7de&border_radius=6"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # fail_on_error: on an API error the job stops instead of committing a
      # "Something went wrong" card, so the last good cards stay in place.
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "${{ env.STATS }}&${{ env.DARK }}"
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "${{ env.STATS }}&${{ env.LIGHT }}"
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "${{ env.LANGS }}&${{ env.DARK }}"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "${{ env.LANGS }}&${{ env.LIGHT }}"
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: update profile cards"
          git push
